[build-system]
requires = ["poetry-core", "versioneer[toml]"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "teachinlathe"
authors = [
  "Vasi Mihalca <vasimihalca@gmail.com>"
]
description = "TeachInLathe - A LinuxCNC controller for TeachIn Lathes"
readme = "README.md"
version = "0.0.1"

packages = [
    { include = "teachinlathe", from = "src" }
]
include = [
    "src/teachinlathe/**/*.qml",
    "src/teachinlathe/**/*.js",
    "src/teachinlathe/**/*.json",
    "src/teachinlathe/**/qmldir",
    "src/teachinlathe/ui/common/images/*"
]

[tool.poetry.dependencies]
python = "^3.11"
ezdxf = "^1.4.4"
# PyQt5 and the LinuxCNC modules (linuxcnc, hal, gcode, qt5_graphics) are
# system packages, not wheels: see debian/control for the full runtime list.


[tool.poetry.scripts]
teachinlathe = "teachinlathe:main"
teachinlathe-tool = "teachinlathe.app.debug_tools:main"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/teachinlathe/_version.py"
versionfile_build = "teachinlathe/_version.py"
tag_prefix = ""
parentdir_prefix = ""
