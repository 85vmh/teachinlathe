<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- center -->
  <circle cx="260" cy="260" r="24" fill="#000"/>

  <!-- start (-60°), as line_to.svg's: 6 px across at 56 px -->
  <circle cx="370" cy="69.47" r="27.43" fill="#000"/>

  <!-- end (-180°), as line_to.svg's: 6 px across at 56 px -->
  <circle cx="40" cy="260" r="27.43" fill="#000"/>

  <!-- arc CCW on the same circle (radius 220), half a line's width clear of the start -->
  <path d="M323.86 49.47
           A220 220 0 0 0 82.94 129.43"
        stroke="#000"
        stroke-width="22.86"/>

  <!-- arrow head as line_to.svg's: base 84, 100 long, its tip and its base's middle on
       the arc, the tip half a line's width clear of the end -->
  <path d="M43.43 221.29
           L44.36 112.83
           L121.52 146.02
           Z"
        fill="#000"/>

</svg>
