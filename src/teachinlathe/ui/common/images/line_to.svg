<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- end circles: 6 px across at 56 px -->
  <circle cx="420" cy="120" r="27.43" fill="#000"/>
  <circle cx="100" cy="420" r="27.43" fill="#000"/>

  <!-- shaft (2 o'clock -> 8 o'clock), half a line's width clear of the first circle -->
  <line x1="383.31" y1="154.40" x2="201.30" y2="325.03"
        stroke="#000" stroke-width="22.86"/>

  <!-- isosceles arrow head, base 84, its tip half a line's width clear of the second circle -->
  <path d="M128.35 393.42
           L172.58 294.39
           L230.03 355.67
           Z"
        fill="#000"/>

</svg>
