<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- Same extent as fillet.svg, as high as undercut.svg: x 96..416, y 96..416.
       The two black lines equally long: 130 -->

  <!-- Top horizontal (black) -->
  <line x1="416" y1="96" x2="286" y2="96"
        stroke="#000000" stroke-width="22.86"/>

  <!-- Left vertical (black) -->
  <line x1="96" y1="286" x2="96" y2="416"
        stroke="#000000" stroke-width="22.86"/>

  <!-- Chamfer (orange) -->
  <line x1="286" y1="96" x2="96" y2="286"
        stroke="#F2992E" stroke-width="22.86"/>

</svg>
