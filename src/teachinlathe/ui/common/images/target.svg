<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-8.88 -8.88 41.76 41.76"
     width="256" height="256"
     fill="none"
     stroke-linecap="round">

  <!-- 2.5 px on screen at 56 px: 2.5 * 41.76 / 56 = 1.864 -->

  <!-- ring -->
  <circle cx="12" cy="12" r="7.068" stroke="#000000" stroke-width="1.864"/>

  <!-- the four ticks -->
  <line x1="12" y1="1.932" x2="12" y2="4.932" stroke="#000000" stroke-width="1.864"/>
  <line x1="12" y1="22.068" x2="12" y2="19.068" stroke="#000000" stroke-width="1.864"/>
  <line x1="1.932" y1="12" x2="4.932" y2="12" stroke="#000000" stroke-width="1.864"/>
  <line x1="22.068" y1="12" x2="19.068" y2="12" stroke="#000000" stroke-width="1.864"/>

  <!-- centre -->
  <circle cx="12" cy="12" r="3" fill="#000000"/>

</svg>
