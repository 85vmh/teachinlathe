<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- As high as chamfer.svg and fillet.svg: x 51..461, y 96..416 -->

  <!-- Cylinder surface (black) -->
  <line x1="461" y1="346" x2="371" y2="346"
        stroke="#000000" stroke-width="22.86"/>

  <!-- Shoulder (black) -->
  <line x1="51" y1="96" x2="51" y2="323.14"
        stroke="#000000" stroke-width="22.86"/>

  <!-- DIN 509 E undercut (orange): the ramp down from the cylinder, the floor,
       the radius up into the shoulder; proportions as the default undercut,
       the ramp steeper than its 15 degrees so it reads at icon size -->
  <path d="M371 346
           L171 416
           L121 416
           A70 70 0 0 1 51 346
           L51 323.14"
        stroke="#F2992E"
        stroke-width="22.86"/>

</svg>
