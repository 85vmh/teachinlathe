<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512" height="512"
     fill="none"
     stroke-linecap="round"
     stroke-linejoin="round">

  <!-- Top horizontal (black) -->
  <line x1="480" y1="80" x2="320" y2="80"
        stroke="#000000" stroke-width="32"/>

  <!-- Left vertical (black) -->
  <line x1="80" y1="320" x2="80" y2="480"
        stroke="#000000" stroke-width="32"/>

  <!-- Much larger chamfer (orange) -->
  <line x1="320" y1="80" x2="80" y2="320"
        stroke="#F2992E" stroke-width="32"/>

</svg>